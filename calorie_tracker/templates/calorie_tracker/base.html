{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Nourish{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nourish: {
                            cream: '#FAF7F2',
                            gold: '#C9A227',
                            dark: '#24211D',
                            muted: '#8C857B',
                            green: '#657A55',
                            lightgold: '#F3E8C3'
                        }
                    },
                    fontFamily: {
                        serif: ['Georgia', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-nourish-cream text-nourish-dark min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="{% url 'dashboard' %}"
               class="text-2xl font-serif font-bold tracking-wide">
                Nour<span class="text-nourish-gold">ish</span>
            </a>

            {% if user.is_authenticated %}
            <div class="flex items-center gap-6">

                <a href="{% url 'dashboard' %}"
                   class="text-sm font-medium hover:text-nourish-gold transition">
                    Dashboard
                </a>

                <a href="{% url 'add_food' %}"
                   class="text-sm font-medium hover:text-nourish-gold transition">
                    Add Food
                </a>

                <a href="{% url 'logout' %}"
                   class="text-sm text-stone-500 hover:text-red-600 transition">
                    Logout
                </a>

            </div>
            {% endif %}

        </div>
    </nav>


    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="border-t border-stone-200 mt-20">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center">

            <p class="font-serif text-lg font-semibold">
                Nour<span class="text-nourish-gold">ish</span>
            </p>

            <p class="text-sm text-nourish-muted mt-2">
                Fuel your body. Know your numbers.
            </p>

            <p class="text-xs text-stone-400 mt-4">
                &copy; 2026 Nourish. All rights reserved.
            </p>

        </div>
    </footer>

</body>
</html>
