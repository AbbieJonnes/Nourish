<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Nourish</title>
</head>

<body>

    <h1>Create your Nourish account</h1>

    <p>Start tracking your daily nutrition.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="#">Log in</a>
    </p>

</body>
</html>
